<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>SHIGANSHINA RP — Frontière des Murs</title>

<style>
:root{
  --bg:#101316;
  --panel:#171c20;
  --panel2:#20272d;
  --line:#39434b;
  --text:#edf2f4;
  --muted:#aab4ba;
  --accent:#c89b54;
  --danger:#b84d4d;
  --good:#67a96b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at top,
      #293238 0,
      #101316 48%,
      #080a0c 100%
    );
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  padding:11px 13px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button.primary{
  background:#8b6736;
  border-color:#b98b4b;
}

button.danger{
  background:#653334;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:12px;
}

/* HEADER */

header{
  background:
    linear-gradient(
      135deg,
      #171c20ee,
      #0e1114ee
    );

  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;

  box-shadow:0 10px 30px #0007;

  position:sticky;
  top:0;
  z-index:5;
}

h1{
  font-size:25px;
  margin:0 0 4px;
  letter-spacing:2px;
}

.sub{
  color:var(--muted);
  font-size:13px;
}

.topbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

.pill{
  padding:6px 9px;
  border-radius:999px;
  background:#0d1012;
  border:1px solid var(--line);
  font-size:12px;
}

/* STRUCTURE */

.grid{
  display:grid;
  grid-template-columns:1.45fr .8fr;
  gap:12px;
  margin-top:12px;
}

.panel{
  background:#151a1eee;
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  box-shadow:0 8px 25px #0005;
}

.panel h2{
  font-size:16px;
  margin:0 0 10px;
}

/* SCENE */

.hero{
  min-height:220px;
  padding:20px;
  border-radius:16px;

  border:1px solid #4a5359;

  background:
    linear-gradient(
      180deg,
      #39434a,
      #171c20 75%
    );

  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";

  position:absolute;
  inset:auto -10% -50px;

  height:110px;

  background:#0b0e10;

  transform:skewY(-5deg);

  opacity:.8;
}

.sceneTitle{
  font-size:30px;
  font-weight:800;
  letter-spacing:1px;

  position:relative;
  z-index:1;
}

.sceneText{
  max-width:720px;
  line-height:1.55;
  color:#d9e0e3;

  position:relative;
  z-index:1;
}

/* ACTIONS */

.actions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:12px;
}

.actions button{
  text-align:left;
}

.wide{
  grid-column:1/-1;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  background:#0d1012;
  border:1px solid var(--line);
  padding:9px;
  border-radius:10px;
}

.statTop{
  display:flex;
  justify-content:space-between;
  font-size:12px;
}

.bar{
  height:6px;
  background:#2b3338;
  border-radius:99px;
  overflow:hidden;
  margin-top:6px;
}

.bar i{
  display:block;
  height:100%;
  background:var(--accent);
}

/* JOURNAL */

.log{
  max-height:250px;
  overflow:auto;
  font-size:13px;
  line-height:1.45;
}

.log p{
  margin:0 0 8px;
  padding-bottom:8px;
  border-bottom:1px solid #2a3034;
}

/* MAP */

.map{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.place{
  min-height:78px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  text-align:left;
}

.place small{
  color:var(--muted);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;

  background:#000b;

  display:none;
  align-items:center;
  justify-content:center;

  padding:14px;

  z-index:20;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(720px,100%);
  max-height:90vh;

  overflow:auto;

  background:#151a1e;

  border:1px solid #58636a;

  border-radius:18px;

  padding:16px;
}

.choices{
  display:grid;
  gap:8px;
  margin-top:12px;
}

/* FORMULAIRE */

.form{
  display:grid;
  gap:9px;
}

.form input,
.form select{
  width:100%;

  padding:12px;

  border-radius:10px;

  border:1px solid var(--line);

  background:#0d1012;

  color:var(--text);
}

/* INVENTAIRE */

.inv{
  display:grid;
  gap:7px;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:8px;

  background:#0d1012;

  padding:9px;

  border-radius:10px;

  border:1px solid var(--line);
}

.notice{
  padding:10px;

  border-radius:10px;

  background:#272014;

  border:1px solid #5d4b2e;

  color:#ead9b7;

  margin-bottom:10px;
}

/* FOOTER */

footer{
  color:#879197;
  text-align:center;
  font-size:11px;
  padding:20px;
}

/* IPHONE */

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .hero{
    min-height:250px;
  }

  .map{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>

<h1>SHIGANSHINA RP</h1>

<div class="sub">
Frontière des Murs • RPG narratif original
</div>

<div class="topbar" id="top"></div>

</header>


<div class="grid">

<main>

<section class="hero" id="scene"></section>


<section class="panel">

<h2>Actions</h2>

<div class="actions" id="actions"></div>

</section>


<section class="panel">

<h2>Carte de Shiganshina</h2>

<div class="map" id="map"></div>

</section>


<section class="panel">

<h2>Journal</h2>

<div class="log" id="log"></div>

</section>

</main>


<aside>

<section class="panel">

<h2>Personnage</h2>

<div id="stats"></div>

</section>


<section class="panel">

<h2>Relations</h2>

<div id="relations"></div>

</section>


<section class="panel">

<h2>Inventaire</h2>

<div class="inv" id="inventory"></div>

</section>


<section class="panel">

<h2>Sauvegarde</h2>

<div class="actions">

<button onclick="saveGame()">
💾 Sauver
</button>

<button onclick="loadGame()">
↩ Charger
</button>

<button
class="danger wide"
onclick="resetGame()">

⚠ Nouvelle partie

</button>

</div>

</section>

</aside>

</div>


<footer>

Fan-game non officiel.
Univers et personnages originaux.

</footer>

</div>


<div class="modal" id="modal">

<div class="modalBox" id="modalBox"></div>

</div>


<script>

/* =========================
   DONNÉES DU JOUEUR
========================= */

const KEY="shiganshina_rp_v1";

let G={

  started:false,

  name:"",
  age:17,

  origin:"Habitant",

  place:"Porte Sud",

  day:1,
  time:7,

  hp:100,
  maxhp:100,

  stamina:100,
  maxstamina:100,

  xp:0,
  level:1,

  money:80,

  force:4,
  agility:4,
  intel:4,
  courage:4,

  reputation:0,
  moral:70,

  equipment:"Tenue civile",
  weapon:"Aucun",

  mission:null,
  quest:null,

  relations:{
    Elias:0,
    Mira:0,
    Kael:0
  },

  inventory:[
    "Pain",
    "Gourde"
  ],

  log:[]
};


/* =========================
   CARTE
========================= */

const places={

  "Place Centrale":[
    "Marché",
    "Boulangerie",
    "Rue des artisans"
  ],

  "Porte Sud":[
    "Poste de garde",
    "Remparts",
    "Casernes"
  ],

  "Quartier Militaire":[
    "Salle d'entraînement",
    "Bureau des missions",
    "Dortoir"
  ],

  "Rue des artisans":[
    "Forge",
    "Tailleur",
    "Atelier"
  ],

  "Marché":[
    "Marchand",
    "Petite taverne",
    "Ruelle"
  ],

  "Remparts":[
    "Tour de guet",
    "Plateforme",
    "Escalier du mur"
  ],

  "Forêt extérieure":[
    "Sentier",
    "Camp abandonné",
    "Clairière"
  ]

};


/* =========================
   JOURNAL
========================= */

function log(t){

  G.log.unshift(

    `<b>J${G.day} • ${
      String(G.time).padStart(2,"0")
    }h</b> — ${t}`

  );

  G.log=G.log.slice(0,30);
}


/* =========================
   PROTECTION HTML
========================= */

function esc(s){

  return String(s).replace(
    /[&<>"']/g,

    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m])

  );

}


/* =========================
   XP / NIVEAUX
========================= */

function addXP(n){

  G.xp+=n;

  let need=70+G.level*45;

  if(G.xp>=need){

    G.xp-=need;

    G.level++;

    G.maxhp+=8;
    G.maxstamina+=7;

    G.hp=G.maxhp;
    G.stamina=G.maxstamina;

    log(
      `Niveau ${G.level} atteint. `+
      `Tes capacités progressent.`
    );

  }

}


/* =========================
   TEMPS
========================= */

function advance(h=1){

  G.time+=h;

  if(G.time>=24){

    G.time-=24;

    G.day++;

    dailyEvent();

  }

  G.stamina=Math.min(
    G.maxstamina,
    G.stamina+8
  );

}


function dailyEvent(){

  if(Math.random()<.45){

    const e=[

      "Un convoi traverse la ville.",

      "La garnison annonce une nouvelle inspection.",

      "Le marché est plus animé que d'habitude.",

      "Un bruit étrange est signalé près des remparts."

    ][
      Math.floor(Math.random()*4)
    ];

    log(e);

  }

}


/* =========================
   AFFICHAGE PRINCIPAL
========================= */

function render(){

  document.getElementById("top").innerHTML=`

    <span class=pill>
      👤 ${esc(G.name||"Sans nom")}
    </span>

    <span class=pill>
      📅 Jour ${G.day}
    </span>

    <span class=pill>
      🕐 ${String(G.time).padStart(2,"0")}h
    </span>

    <span class=pill>
      📍 ${esc(G.place)}
    </span>

    <span class=pill>
      ⭐ Niv. ${G.level}
    </span>

    <span class=pill>
      💰 ${G.money}₤
    </span>

  `;


  document.getElementById("scene").innerHTML=`

    <div class=sceneTitle>
      ${esc(G.place)}
    </div>

    <div class=sceneText>
      ${sceneText()}
    </div>

  `;


  document.getElementById("actions").innerHTML=

    actions().map(

      (x,i)=>`

        <button
          class="${x.primary?'primary':''}
          ${x.wide?'wide':''}"
          onclick="act(${i})">

          ${x.t}

        </button>

      `

    ).join("");


  document.getElementById("stats").innerHTML=
    statHTML();


  document.getElementById("relations").innerHTML=

    Object.entries(G.relations).map(

      ([n,v])=>`

        <div class=item>

          <span>${n}</span>

          <b>
            ${v>0?"+":""}${v}
          </b>

        </div>

      `

    ).join("");


  document.getElementById("inventory").innerHTML=

    G.inventory.length

    ?

    G.inventory.map(

      (x,i)=>`

        <div class=item>

          <span>
            🎒 ${esc(x)}
          </span>

          <button
            onclick="useItem(${i})">

            Utiliser

          </button>

        </div>

      `

    ).join("")

    :

    "<div class=sub>Inventaire vide</div>";


  document.getElementById("log").innerHTML=

    G.log.map(

      x=>`<p>${x}</p>`

    ).join("")

    ||

    "<div class=sub>Aucun événement.</div>";


  document.getElementById("map").innerHTML=

    Object.keys(places).map(

      p=>`

        <button
          class=place
          onclick="travel('${p.replaceAll("'","\\\\'")}')">

          <b>📍 ${p}</b>

          <small>
            ${places[p].length} zones
          </small>

        </button>

      `

    ).join("");

}


/* =========================
   DESCRIPTION DE LA SCÈNE
========================= */

function sceneText(){

  if(!G.started)

    return `
      Crée ton personnage pour entrer
      dans la ville.
    `;


  if(G.quest)

    return `

      <b>Objectif :</b>
      ${esc(G.quest)}

      <br><br>

      La ville vit autour de toi.
      Tes décisions modifient tes relations,
      ta réputation et les événements futurs.

    `;


  return `

    Les rues sont animées.

    Des soldats patrouillent,
    les marchands négocient et les
    remparts dominent l'horizon.

    <br><br>

    Où vas-tu agir ?

  `;

}


/* =========================
   ACTIONS
========================= */

let A=[];


function actions(){

  if(!G.started)

    return [

      {
        t:"Créer mon personnage",
        primary:true,
        wide:true
      }

    ];


  A=[

    {
      t:"🧭 Explorer le quartier",
      f:()=>explore()
    },

    {
      t:"🏋️ S'entraîner",
      f:()=>train()
    },

    {
      t:"📜 Chercher une mission",
      f:()=>missionBoard()
    },

    {
      t:"💬 Parler aux habitants",
      f:()=>talk()
    },

    {
      t:"🛒 Aller au marché",
      f:()=>shop()
    },

    {
      t:"🗺️ Voir les sous-zones",
      f:()=>subzones()
    },

    {
      t:"🌙 Se reposer",
      f:()=>rest()
    },

    {
      t:"📖 Fiche personnage",
      f:()=>characterSheet()
    }

  ];


  if(G.mission)

    A.unshift({

      t:"⚔️ Continuer la mission",
      primary:true,
      f:()=>missionStep()

    });


  return A;

}


function act(i){

  if(A[i]?.f)

    A[i].f();

}


/* =========================
   FENÊTRE MODALE
========================= */

function modal(title,body){

  document.getElementById("modalBox").innerHTML=`

    <h2>${title}</h2>

    ${body}

  `;

  document
    .getElementById("modal")
    .classList
    .add("show");

}


function closeModal(){

  document
    .getElementById("modal")
    .classList
    .remove("show");

}


/* =========================
   CRÉATION PERSONNAGE
========================= */

function create(){

  modal(

    "Création du personnage",

    `

    <div class=form>

      <input
        id=n
        placeholder="Prénom / nom"
        maxlength="24">

      <input
        id=a
        type=number
        min=13
        max=40
        value=17
        placeholder="Âge">

      <select id=o>

        <option>Habitant</option>

        <option>
          Famille militaire
        </option>

        <option>
          Marchand
        </option>

        <option>
          Éclaireur en formation
        </option>

      </select>

      <select id=p>

        <option>Porte Sud</option>

        <option>
          Place Centrale
        </option>

        <option>
          Quartier Militaire
        </option>

      </select>

      <button
        class="primary"
        onclick="finishCreate()">

        Entrer dans Shiganshina

      </button>

    </div>

    `

  );

}


function finishCreate(){

  let n=
    document
      .getElementById("n")
      .value
      .trim();

  if(!n){

    alert("Choisis un nom.");

    return;

  }


  G.started=true;

  G.name=n;

  G.age=
    +document
      .getElementById("a")
      .value;

  G.origin=
    document
      .getElementById("o")
      .value;

  G.place=
    document
      .getElementById("p")
      .value;


  if(
    G.origin==="Famille militaire"
  ){

    G.force++;
    G.courage++;
    G.reputation=2;

  }


  if(
    G.origin==="Marchand"
  ){

    G.intel++;
    G.money+=50;

  }


  if(
    G.origin==="Éclaireur en formation"
  ){

    G.agility++;
    G.courage++;

    G.stamina+=10;
    G.maxstamina+=10;

  }


  G.quest=
    "Découvre la ville et fais ta première rencontre.";


  log(
    `Bienvenue à Shiganshina, ${
      esc(G.name)
    }.`
  );


  closeModal();

  render();

}


/* =========================
   DÉMARRAGE
========================= */

document
  .getElementById("modal")
  .addEventListener(
    "click",

    e=>{

      if(e.target.id==="modal")
        closeModal();

    }

  );

render();


if(!G.started)

  setTimeout(
    create,
    300
  );
/* =========================
   EXPLORATION
========================= */

function explore(){

  const events=[

    {
      text:"Tu avances dans une rue calme. Un marchand te fait signe.",
      action:()=>{
        G.money+=10;
        log("Un marchand te récompense pour avoir transporté une petite caisse.");
        addXP(15);
      }
    },

    {
      text:"Tu remarques un soldat qui semble chercher quelqu'un.",
      action:()=>{
        G.relations.Elias+=2;
        log("Ta rencontre avec un soldat améliore légèrement ta réputation.");
        addXP(12);
      }
    },

    {
      text:"Une patrouille passe devant toi. Tu observes leur équipement.",
      action:()=>{
        G.intel++;
        log("Tu apprends quelques détails sur les patrouilles.");
        addXP(18);
      }
    },

    {
      text:"Tu entends un bruit provenant d'une ruelle.",
      action:()=>{
        randomEvent();
      }
    },

    {
      text:"Tu aides un habitant à déplacer des marchandises.",
      action:()=>{
        G.reputation++;
        G.moral+=3;
        log("Les habitants commencent à te reconnaître.");
        addXP(20);
      }
    }

  ];

  const e=
    events[
      Math.floor(Math.random()*events.length)
    ];

  modal(
    "🧭 Exploration",
    `
      <p>${e.text}</p>

      <div class="choices">

        <button
          class="primary"
          onclick="closeModal();(${e.action.toString()})()">

          Continuer

        </button>

      </div>
    `
  );

  advance(1);
}


/* =========================
   ENTRAÎNEMENT
========================= */

function train(){

  if(G.stamina<15){

    modal(
      "😮‍💨 Fatigue",
      `
        <p>
          Tu es trop fatigué pour continuer.
        </p>

        <button onclick="closeModal()">
          Retour
        </button>
      `
    );

    return;
  }


  const stats=[
    "force",
    "agility",
    "intel",
    "courage"
  ];

  const stat=
    stats[
      Math.floor(Math.random()*stats.length)
    ];


  G[stat]++;

  G.stamina-=15;

  addXP(25);

  advance(1);

  log(
    `Entraînement terminé : ${stat} augmente.`
  );

  render();

}


/* =========================
   REPOS
========================= */

function rest(){

  G.hp=G.maxhp;

  G.stamina=G.maxstamina;

  G.moral=Math.min(
    100,
    G.moral+15
  );

  advance(6);

  log("Tu prends plusieurs heures de repos.");

  render();

}


/* =========================
   SOUS-ZONES
========================= */

function subzones(){

  const list=places[G.place]||[];

  modal(

    `📍 ${G.place}`,

    `

      <p>
        Choisis où aller.
      </p>

      <div class=choices>

        ${
          list.map(
            (x,i)=>`

              <button
                onclick="goSubzone(${i})">

                ${x}

              </button>

            `
          ).join("")
        }

        <button onclick="closeModal()">
          Retour
        </button>

      </div>

    `

  );

}


function goSubzone(i){

  const list=
    places[G.place]||[];

  const zone=list[i];

  closeModal();

  advance(1);

  log(
    `Tu te rends dans : ${zone}.`
  );

  modal(

    `📍 ${zone}`,

    `

      <p>
        Tu arrives dans cette partie de
        Shiganshina.
      </p>

      <p class=sub>
        L'endroit pourrait devenir important
        dans une future quête.
      </p>

      <div class=choices>

        <button
          class=primary
          onclick="closeModal();explore()">

          Explorer

        </button>

        <button
          onclick="closeModal()">

          Retour

        </button>

      </div>

    `

  );

  render();

}


/* =========================
   DÉPLACEMENT
========================= */

function travel(place){

  if(place===G.place){

    log("Tu es déjà ici.");

    return;

  }

  G.place=place;

  advance(1);

  log(
    `Tu arrives à ${place}.`
  );

  render();

}


/* =========================
   RENCONTRES
========================= */

function talk(){

  const people=[

    {
      name:"Elias",
      text:

function talkChoice(name,value){

  G.relations[name]+=value;

  if(value>0){

    G.reputation++;

    G.moral+=2;

  }

  if(value<0){

    G.moral-=2;

  }

  addXP(10);

  advance(1);

  log(
    `Conversation avec ${name}.`
  );

  closeModal();

  render();

}

function buy(i){

  const item=shopItems[i];

  if(G.money<item.price){

    alert("Tu n'as pas assez d'argent.");

    return;

  }

  G.money-=item.price;

  G.inventory.push(item.name);

  log(
    `Achat : ${item.name}.`
  );

  render();

  shop();

}


/* =========================
   INVENTAIRE
========================= */

function useItem(i){

  const item=G.inventory[i];


  if(item==="Bandage"){

    if(G.hp>=G.maxhp){

      alert("Tes PV sont déjà au maximum.");

      return;

    }

    G.hp=Math.min(
      G.maxhp,
      G.hp+30
    );

  }


  else if(item==="Ration"){

    G.stamina=Math.min(
      G.maxstamina,
      G.stamina+25
    );

  }


  else if(item==="Lame d'entraînement"){

    G.weapon="Lame d'entraînement";

    G.force++;

  }


  else if(item==="Veste renforcée"){

    G.equipment="Veste renforcée";

    G.maxhp+=15;
    G.hp+=15;

  }


  else{

    alert("Cet objet ne peut pas être utilisé.");

    return;

  }


  G.inventory.splice(i,1);

  log(
    `Objet utilisé : ${item}.`
  );

  render();

}

function statBox(name,value){

  return `

      <div class=statTop>

        <span>${name}</span>

        <b>${value}</b>

      </div>

      <div class=bar>

        <i style="width:${percent}%"></i>

    </div>

}

/* =========================
   SÉLECTION MISSION
========================= */

function selectMission(i){

  const m=missions[i];


  if(G.level<m.level){

    modal(

      "🔒 Mission verrouillée",

      `

        <p>
          Cette mission demande le niveau
          <b>${m.level}</b>.
        </p>

        <p class=sub>
          Continue ton entraînement et
          accomplis d'autres missions.
        </p>

        <button onclick="missionBoard()">
          Retour aux missions
        </button>

      `

    );

    return;

  }


  G.mission={

    ...m,
    progress:0

  };


  G.quest=m.name;

  log(
    `Mission acceptée : ${m.name}.`
  );


  closeModal();

  render();

}


/* =========================
   ÉTAPE DE MISSION
========================= */

function missionStep(){

  if(!G.mission)
    return;


  const m=G.mission;


  if(G.stamina<20){

    modal(

      "😮‍💨 Endurance insuffisante",

      `

        <p>
          Tu n'as pas assez d'endurance
          pour continuer la mission.
        </p>

        <button
          onclick="closeModal();rest()">

          Se reposer

        </button>

      `

    );

    return;

  }


  G.stamina-=20;

  advance(1);


  const chance=
    45
    +G.force*3
    +G.agility*3
    +G.intel*2
    +G.courage*4
    +G.level*2
    -m.danger*7;


  const success=
    Math.random()*100<chance;


  if(success){

    G.mission.progress++;

    addXP(25);

    log(
      `Tu progresses dans la mission : ${
        m.name
      }.`
    );

  }

  else{

    G.hp-=Math.floor(
      Math.random()*8
    )+3;

    G.moral-=2;

    log(
      "Une difficulté ralentit ta progression."
    );

  }


  if(G.hp<=0){

    missionFailure();

    return;

  }


  if(G.mission.progress>=3){

    missionSuccess();

    return;

  }


  render();

  missionContinue();

}


/* =========================
   CONTINUER UNE MISSION
========================= */

function missionContinue(){

  if(!G.mission)
    return;


  const m=G.mission;


  modal(

    `⚔️ ${m.name}`,

    `

      <p>
        ${m.description}
      </p>

      <div class=notice>

        Progression :
        <b>${m.progress}/3</b>

      </div>


      <div class=choices>

        <button
          class=primary
          onclick="closeModal();missionStep()">

          Continuer

        </button>

        <button
          onclick="abandonMission()">

          Abandonner

        </button>

      </div>

    `

  );

}


/* =========================
   MISSION RÉUSSIE
========================= */

function missionSuccess(){

  const m=G.mission;


  G.money+=m.reward;

  G.reputation+=2;

  G.moral=Math.min(
    100,
    G.moral+5
  );


  addXP(m.xp);


  log(
    `Mission réussie : ${m.name}. `+
    `Récompense : ${m.reward}₤.`
  );


  G.mission=null;

  G.quest=null;


  modal(

    "🏆 Mission réussie",

    `

      <div class=notice>

        <b>${m.name}</b>

        <br><br>

        💰 +${m.reward}₤

        <br>

        ⭐ +${m.xp} XP

        <br>

        🏅 Réputation +2

      </div>


      <button
        class=primary
        onclick="closeModal();render()">

        Continuer

      </button>

    `

  );

}


/* =========================
   MISSION ÉCHOUÉE
========================= */

function missionFailure(){

  G.hp=1;

  G.moral=Math.max(
    0,
    G.moral-10
  );


  G.mission=null;

  G.quest=null;


  log(
    "La mission se termine prématurément."

  modal(

    `

  );

}

    );

  }


  if(choice===2){

    G.force++;

    G.agility++;

    log(

    );

  }


  if(choice===3){

    G.relations.Elias++;
    G.relations.Mira++;
    G.relations.Kael++;

    G.moral+=3;

    log(
      "Tu renforces tes liens avec ton entourage."
    );

  }


  addXP(30);

  advance(1);

  closeModal();

  render();

}
